name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          $target = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force $target | Out-Null
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $target -Force

      - name: Build
        run: dotnet build DutyHuddle.sln -c Release

      - name: Test
        run: dotnet test DutyHuddle.sln -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: DutyHuddle
          path: src/DutyHuddle/bin/Release/DutyHuddle/latest.zip
